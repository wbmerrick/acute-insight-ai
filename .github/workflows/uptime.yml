name: Uptime check

# Runs outside Vercel every 15 minutes. If https://acuteinsight.ai/api/health is
# not healthy, opens (or updates) a GitHub issue labelled "site-down" — GitHub
# emails the repo owner. When it recovers, the issue is closed with a note.
# No secrets: uses the built-in GITHUB_TOKEN.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe health and homepage
        id: probe
        shell: bash
        run: |
          set +e
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 20 https://acuteinsight.ai/api/health)
          home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://acuteinsight.ai/?uptime=$(date +%s)")
          status=$(grep -o '"status":"ok"' /tmp/health.json || true)
          commit=$(grep -o '"commit":"[a-z0-9]*"' /tmp/health.json | cut -d'"' -f4)
          echo "api_code=$code" >> "$GITHUB_OUTPUT"
          echo "home_code=$home" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ] && [ -n "$status" ] && [ "$home" = "200" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "api=$code home=$home status=${status:-none} commit=${commit:-?}"

      - name: Open or update the outage issue
        if: steps.probe.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Site down: acuteinsight.ai not healthy';
            const body = [
              `**Detected:** ${new Date().toISOString()}`,
              `**/api/health:** HTTP ${{ steps.probe.outputs.api_code }}`,
              `**Homepage:** HTTP ${{ steps.probe.outputs.home_code }}`,
              '',
              'Checked from GitHub Actions (outside Vercel). Look at Vercel → Deployments and Supabase status first.',
              'Patients see the 911 line on every surface regardless; clinicians: stop accepting until this closes (escalation protocol E).',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'site-down' });
            if (open.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: `Still down at ${new Date().toISOString()} — /api/health ${{ steps.probe.outputs.api_code }}, homepage ${{ steps.probe.outputs.home_code }}.` });
            } else {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'site-down', color: 'd73a4a', description: 'Opened automatically by the uptime check' }); } catch {}
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['site-down'] });
            }

      - name: Close the outage issue on recovery
        if: steps.probe.outputs.healthy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'site-down' });
            for (const issue of open) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Recovered at ${new Date().toISOString()} — serving commit ${{ steps.probe.outputs.commit }}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }
